spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/devpilot_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true

devpilot:
  jwt:
    secret: test-jwt-secret-key-for-devpilot-integration-tests-0123456789abcdef
    expire-minutes: 60
  storage:
    path: ./target/test-storage
  admin:
    bootstrap-username: admin
    bootstrap-password: admin123456

logging:
  level:
    com.devpilot: WARN
